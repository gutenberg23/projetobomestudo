# Publica as Edge Functions do Supabase sem precisar do computador.
# GitHub → Actions → "Publicar Edge Functions" → Run workflow.
# Precisa do secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions),
# criado em https://supabase.com/dashboard/account/tokens
name: Publicar Edge Functions

on:
  workflow_dispatch:
    inputs:
      funcoes:
        description: "Funções a publicar, separadas por espaço (vazio = todas)"
        required: false
        default: ""
      apagar:
        description: "Funções a APAGAR do Supabase, separadas por espaço (opcional)"
        required: false
        default: ""

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ukkatmoathxhbaelstzo
      FUNCOES: ${{ inputs.funcoes }}
      APAGAR: ${{ inputs.apagar }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Conferir o token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o secret SUPABASE_ACCESS_TOKEN no repositório."
            exit 1
          fi

      - name: Publicar
        run: |
          set -e
          if [ -n "$FUNCOES" ]; then
            for f in $FUNCOES; do
              echo "Publicando $f"
              supabase functions deploy "$f" --project-ref "$PROJECT_REF"
            done
          else
            for dir in supabase/functions/*/; do
              f=$(basename "$dir")
              [ "$f" = "_shared" ] && continue
              [ -f "$dir/index.ts" ] || continue
              echo "Publicando $f"
              supabase functions deploy "$f" --project-ref "$PROJECT_REF"
            done
          fi

      - name: Apagar funções antigas
        if: ${{ inputs.apagar != '' }}
        run: |
          for f in $APAGAR; do
            echo "Apagando $f"
            supabase functions delete "$f" --project-ref "$PROJECT_REF" || echo "::warning::Não deu para apagar $f (talvez já não exista)"
          done
